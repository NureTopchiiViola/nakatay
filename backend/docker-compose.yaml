version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nakatay_postgres
    environment:
      POSTGRES_DB: nakatay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: