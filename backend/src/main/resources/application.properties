spring.application.name=backend
server.port=${PORT:8081}

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/nakatay_db}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties],optional:file:../.env[.properties]
google.client-id=${GOOGLE_CLIENT_ID}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}